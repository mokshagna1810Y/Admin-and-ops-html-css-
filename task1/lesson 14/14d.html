<!DOCTYPE html>
<html>
    <head>
        <style>
            .overlay{
                background-color: rgba(0, 0, 0, 0.5);
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .modal {
                width:400px;
                position: relative;
                background-color: white;
                padding-right: 10px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 10px;
                border-radius: 5px;
                
                overflow: hidden;
            }
            .modaltitle{
                font-family: Arial;
                font-weight: bold;
                font-size: 24px;
                margin-bottom: 12px;
            }
            .modalcontent {
            font-family: Arial;
            margin-bottom: 12px;
            }
        </style>
    </head>
    <body>
        <div style="background-color: green;
                position: fixed;
                right: 0px;
                bottom: 0px;
                top: 0px;
                width: 100px;
                position: absolute;">
            <div
            style="color: white;
            position: relative;
            left: 0px;
            top: 0px;
            background-color: green;">
                right sidebar
                
            </div>
        <div class="overlay">
            <div class="modal">
                <div class="modaltitle">
                    Modal Title
                </div>
                <div class="modalcontent">
                    This is a modal
                </div>
                <button>
                    close
                </button>
            </div>
        </div>
    </body>
</html>
