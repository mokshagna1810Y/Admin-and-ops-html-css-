<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Blury loading</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        .bg{
            z-index: -1;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100vh;
            width: 100vw;
        }

        .bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;   /* key line */
        } 

        .loading{
            font-size: 50px;
            color: white;
        }
    </style>
  </head>
  <body>
    <section class="bg">
        <img src="images/im.jpg">
    </section>
    <div class="loading">0%</div>

    <script>
       
            const scale = (num, in_min, in_max, out_min, out_max) => {
            return (num - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
            }
            let load=0;
            let int = setInterval(blur,30);
            function blur(){
                load++;

                if(load>99){
                    clearInterval(int);
                }
                document.querySelector('.loading').innerHTML=`${load}%`;
                document.querySelector('.loading').style.opacity=scale(load,0,100,1,0);
                document.querySelector('.bg').style.filter=
                `blur(${scale(load,0,100,30,0)}px)`;

            }



    </script>
  </body>
</html>
