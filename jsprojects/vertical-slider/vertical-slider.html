<!DOCTYPE html>
<html>
    <head>
        <title>vertical slider</title>
        <link rel="stylesheet" href="vertical-slider.css">
    </head>
    <body>
        <div class="slider">
            <div class="lslide">
                <div style="background-color: pink;">
                    <h1>pink</h1>
                </div>
                <div style="background-color: blue;">
                    <h1>blue</h1>
                </div>
                <div style="background-color: yellow;">
                    <h1>yellow</h1>
                </div>
                <div style="background-color: green">
                    <h1>green</h1>
                </div>
            </div>
            <div class="rslide">
                <div style="background-image: url('../images/green.jpg')"></div>
                <div style="background-image: url('../images/yellow.jpg')"></div>
                <div style="background-image: url('../images/blue.jpg')"></div>
                <div style="background-image: url('../images/pink.jpg')"></div>
            </div>
            <div class="action-buttons">
                <button class="down-button">
                    down
                </button>
                <button class="up-button">
                  up
                </button>
            </div>
            
         </div>
         <script src="vertical-slider.js"></script>


    </body>
</html>
